<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="juego.css">
</head>
<body>
    <h1>Piedra, Papel o Tijera</h1>

    <div class="elecciones">
        <div class="jugadorBox">
            <p>Tú</p>
            <img id="imgJugador" class="imgResultado" src="" alt="">
        </div>
        <div class="jugadorBox">
            <p>Máquina</p>
            <img id="imgMaquina" class="imgResultado" src="" alt="">
        </div>
    </div>

    <p id="resultado"></p>

    <div class="botones">
        <button id="piedra" class="boton" onclick="seleccionar('piedra')"></button>
        <button id="papel" class="boton" onclick="seleccionar('papel')"></button>
        <button id="tijera" class="boton" onclick="seleccionar('tijera')"></button>
    </div>

    <p id="avisoModo">Pulsa "M" o "D" para activar el modo oscuro</p>

    <script src="juego.js"></script>
</body>
</html>
